name: fikir_sign
description: "A chat-style Ethiopian Sign Language communication app for hospital staff and deaf patients."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Architecture & State
  provider: ^6.1.2
  flutter_dotenv: ^5.2.1
  shared_preferences: ^2.5.3

  # Networking
  http: ^1.3.0

  # Hardware & Accessibility Services
  camera: ^0.11.2
  flutter_tts: ^4.2.3
  speech_to_text: ^7.0.0

  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/phrases.json
